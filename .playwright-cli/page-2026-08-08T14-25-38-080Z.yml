        - generic [ref=f2e45]:
          - heading "99.99% 的复读，为什么可能筛出更差的推理数据？" [level=1] [ref=f2e46]
          - paragraph [ref=f2e47]: 多位教师都给出正确的长推理时，最自然的一条未必最适合拿来训练学生模型。问题不在答案真假，而在评分时把整条轨迹压成一个 token 平均分：前面真正困难的推导只出现一次，后面反复引用其结论却会变得极高概率，最终反而由“容易复读”的部分主导排序。
          - paragraph [ref=f2e48]:
            - text: ICML 2026 Spotlight 论文
            - 'link "The Signal is in the Steps: Local Scoring for Reasoning Data Selection" [ref=f2e49] [cursor=pointer]':
              - /url: https://openreview.net/forum?id=GcB3a6IonG
            - text: 提出 LALP（Local Average Log Probability）。它不替代答案正确性验证；在候选已经通过验证的前提下，它用学生模型在局部上下文中完成每一步的自然度，来挑选更适合蒸馏的推理轨迹。
          - generic [ref=f2e50]:
            - link "OpenReview" [ref=f2e51] [cursor=pointer]:
              - /url: https://openreview.net/forum?id=GcB3a6IonG
            - link "arXiv" [ref=f2e52] [cursor=pointer]:
