            - generic [ref=f2e718]:
              - paragraph [ref=f2e719]: 11 / Reading takeaway
              - heading "筛数据，别只问“整篇顺不顺”" [level=3] [ref=f2e720]
              - paragraph [ref=f2e721]: LALP 的核心不是宣布“低概率步骤都更好”，也不是以局部评分替代正确性检查。它提出一个更窄、可检验的问题：若学生最终需要把局部推理动作重组到新题上，候选数据的排序是否也该主要审视这些动作的局部可支持性？
              - paragraph [ref=f2e722]: 对长轨迹蒸馏而言，这个问题会暴露那些看似无害的 easy token：结论复读、模板化过渡和长篇解释能让全局平均很漂亮，却不一定提升首次推导的能力。
          - generic [ref=f2e723]:
            - heading "附录与延伸讨论" [level=2] [ref=f2e724]
            - paragraph [ref=f2e725]: 以下内容是根据论文边界整理出的工程讨论，不是论文已经验证的通用训练配方。
            - heading "将 LALP 放入数据管线时，可额外记录什么？" [level=3] [ref=f2e726]
            - list [ref=f2e727]:
              - listitem [ref=f2e728]:
                - strong [ref=f2e729]: 把正确性与可学习性分开保存。
                - text: 先保留 verifier、事实检查或答案比对的结果，再记录 LALP 作为正确候选之间的选择依据，避免评分器被误用为正确性判定器。
              - listitem [ref=f2e730]:
                - strong [ref=f2e731]: 同时审计 GALP 与 LALP。
                - text: 若二者分歧很大，可检查候选是否存在长重复、模板性结尾，或单个关键步骤被长解释掩盖；分歧本身不是自动删样本的理由。
              - listitem [ref=f2e732]:
                - strong [ref=f2e733]: 对窗口和切分做敏感性分析。
                - text: 在数学证明、代码轨迹、工具调用等任务上分别测试
                - generic [ref=f2e734]:
                  - generic [ref=f2e735]: k
                  - math [ref=f2e739]:
                    - generic [ref=f2e740]: k
                - text: 与步骤切分规则，观察排名是否稳定，尤其检查远程依赖是否被误伤。
              - listitem [ref=f2e741]:
                - strong [ref=f2e742]: 让选择成本进入评估。
                - text: LALP 需要步骤切分和多次局部打分；在比较训练收益时，应并列报告筛选成本、候选数、训练预算与下游泛化，而不只保留最终准确率。
            - heading "与 BLL-Loss 的位置差异" [level=3] [ref=f2e743]
            - paragraph [ref=f2e744]: LALP 和下一集的 BLL-Loss 都在追问“token 概率该怎样影响学习”，但操作位置不同：LALP 在训练前的候选轨迹层做选择，减少复读对整条数据分数的掩盖；BLL-Loss 在训练时的 token 层限制极低概率目标对更新的过度牵引。一个调整进入训练的轨迹，另一个调整已进入训练的局部优化力度。
            - heading "资料与制作边界" [level=3] [ref=f2e745]
