              - paragraph [ref=f2e656]: 卡片中的 A/B 是说明性例子，不是论文实验数据。A 在第一个短步骤上很难，却在后面 90 个 token 中反复复读；B 的两个步骤都较稳定。按 token 聚合，A 的大量容易 token 把平均值推高；按步骤聚合，A 的难步骤不能被长度淹没，B 因每一步都更可预测而被选中。
              - paragraph [ref=f2e657]: 这个例子同时拆开 LALP 的两个作用：局部窗口降低“见过后再说”的虚高概率，步骤等权降低“写得更长所以更有票数”的影响。只使用其中一个改动，仍可能留下另一种粒度错位。
