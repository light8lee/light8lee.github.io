              - paragraph [ref=f2e664]: 论文的泛化解释是覆盖密度差异：完整测试轨迹在训练集中通常近邻稀疏，而代入、定义设置、定理应用等局部步骤更容易找到相似支持。因此新题求解更像重组小动作，而不是检索一整条旧答案。
              - paragraph [ref=f2e665]:
                - text: 这不是把步骤当作完全独立的 token 块。LALP 仍让当前步骤读取最近
                - generic [ref=f2e666]:
