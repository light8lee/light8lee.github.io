              - paragraph [ref=e501]: 所以上线前别问能不能自我改进，只问六件事：改动有没有版本和 Diff？反馈来自真实结果或独立 Verifier？更新和评估是否泄漏？哪些文件权限只读？每个 Gain 有没有证据、成本、回归？何时停止、回滚？缺一项，只是自动调参；六项齐备，才谈部署。真正递归的不是无限重写，而是环外控制下的搜索。预算固定，你留更强更贵，还是略弱更稳？
