              - paragraph [ref=e494]: 听起来层数越多越强？STOP 先泼冷水：较弱模型的递归迭代可能不升反降——连自己的改动好不好都判断不了，递归只会放大弱点。Weng 也拆开两种能力：能写更新，和能用好更新，不是一回事。评估因此必须双份：改动有没有效，模型用它有没有收益。模型能力、任务分布、评测质量，仍是上限。
