      - article [ref=e46]:
        - generic [ref=e47]:
          - paragraph [ref=e48]: 2026-08-21
          - heading "RSI Harness Engineering：从运行系统到受控递归改进" [level=1] [ref=e49]
          - paragraph [ref=e50]: 52 张核心图文，循着一条完整链路展开：先搭建可运行的 Agent Harness，再优化 Context、Workflow 与 Code，最后以独立验证、权限边界和进化搜索完成受控的递归改进。
          - generic [ref=e51]:
            - generic [ref=e52]: Agent
            - generic [ref=e53]: RSI
            - generic [ref=e54]: Harness Engineering
            - generic [ref=e55]: Lilian Weng
            - generic [ref=e56]: visual-essay
            - generic [ref=e57]: image-series
        - generic [ref=e58]:
          - paragraph [ref=e59]:
            - text: RSI 的重点不是让模型在答案之后“再想一次”，而是改进包围模型的运行系统。Lilian Weng 将这个系统称为 harness：它负责规划、工具调用、上下文、持久状态、artifact 与评估；因此，能否自我改进取决于这台机器是否有稳定的状态、明确的可编辑面和独立的裁判。详见 Weng 的
            - link "Harness Engineering for Self-Improvement" [ref=e60] [cursor=pointer]:
              - /url: https://lilianweng.github.io/posts/2026-07-04-harness/
            - text: 。
          - heading "先把整件事看成一张图" [level=2] [ref=e61]
          - paragraph [ref=e62]:
            - text: 本文只讨论部署层的 RSI：不改基础模型权重，而是把模型放入一个可运行、可观察的 harness，再有条件地优化这套系统。逻辑只有一条：
            - strong [ref=e63]: 先让任务留下可用证据；再让 evidence 指导一个范围受限的改动；最后由不在改动范围内的验证器决定它能否留下。
          - region "RSI Harness Engineering 总体脉络" [ref=e64]:
            - article [ref=e65]:
              - img "任务通过计划、工具、测试与观察构成运行闭环" [ref=e66]
              - generic [ref=e67]:
                - paragraph [ref=e68]: 01 · 先让系统跑起来
                - heading "运行并留下状态" [level=3] [ref=e69]
                - paragraph [ref=e70]: Workflow、文件记忆与后台任务，让一次任务变成可回放的过程，而不是一次性对话。
            - article [ref=e71]:
              - img "多个工作流候选运行、评分并进入归档" [ref=e72]
              - generic [ref=e73]:
                - paragraph [ref=e74]: 02 · 再限定能改什么
                - heading "把 Harness 当作候选程序" [level=3] [ref=e75]
                - paragraph [ref=e76]: Context、控制流与部分 code 可以成为候选；每次改动必须带版本、diff、证据和可比较的结果。
            - article [ref=e77]:
              - img "证据驱动提案，通过留出验证后接受或拒绝，验证器处于保护边界之外" [ref=e78]
              - generic [ref=e79]:
                - paragraph [ref=e80]: 03 · 最后才允许递归改进
                - heading "提案和裁决必须分离" [level=3] [ref=e81]
                - paragraph [ref=e82]: 改进器从失败证据提出窄 diff；held-out 测试、权限、预算与回滚保持只读，负责 accept 或 reject。
          - paragraph [ref=e83]: 关键区别在于：模型可以提出改动，但不能同时修改裁判。缺少第一步，系统没有稳定的优化对象；缺少第三步，所谓“变好”可能只是在改写评分规则。
          - paragraph [ref=e84]: 为避免同一张地图、封面与结论反复出现，本文从原始 79 张场景卡中保留 52 张核心图文：机制、流程、案例和关键约束都在；重复的导览页、连载预告与“本页要点”复述被收起。
          - heading "一、先让系统持续运行" [level=2] [ref=e85]
          - paragraph [ref=e86]: 递归改进的前提，是有一个能执行任务、留下状态、从中断恢复并调度并行工作的基础设施。先解决“任务怎么跑起来”，运行过程才会变得可观察、可复现，之后的优化也才有对象可改。
          - heading "Workflow：把 Prompt 变成可观察的运行闭环" [level=3] [ref=e87]
          - generic [ref=e88]:
            - figure [ref=e89]:
              - img "Workflow 图文：Weng 这篇文章到底做了什么？" [ref=e90]
            - generic [ref=e91]:
              - paragraph [ref=e92]: 运行闭环 · 1 / 5
              - paragraph [ref=e93]: Weng 这篇文章到底做了什么？
              - paragraph [ref=e94]: 这篇文章的核心贡献，是把注意力从单次模型回答，移到模型外部的 Harness：谁组织计划，谁调工具，状态放在哪里，结果怎样被评估。它给出的不是一个神奇算法，而是一张工程路线图。今天这一集只放大其中的 Pattern 1，Workflow Automation，因为任何优化，都必须先拥有一个真实、可观察、能再次执行的过程。
          - generic [ref=e95]:
            - figure [ref=e96]:
              - img "Workflow 图文：Prompt 是请求，Workflow 是运行时" [ref=e97]
            - generic [ref=e98]:
              - paragraph [ref=e99]: 运行闭环 · 2 / 5
              - paragraph [ref=e100]: Prompt 是请求，Workflow 是运行时
              - paragraph [ref=e101]: 提示词可以说，请仔细修复这个 bug。但它只规定这一次模型该怎样思考，并没有定义先读哪个文件、何时调用工具、失败后看哪段日志、测试通过前能不能停止。现实任务有状态、有副作用，也会被中断。Workflow 的作用，就是把这些动作接成可继续、可恢复的运行时。
          - generic [ref=e102]:
            - figure [ref=e103]:
              - img "Workflow 图文：最小闭环：每一步都被下一步纠正" [ref=e104]
            - generic [ref=e105]:
              - paragraph [ref=e106]: 运行闭环 · 3 / 5
              - paragraph [ref=e107]: 最小闭环：每一步都被下一步纠正
              - paragraph [ref=e108]: 把 Pattern 1 压缩成最小状态机，就是目标进入计划，计划触发工具执行，工具返回真实结果，系统观察测试或日志，再决定下一步，直到满足停止条件。模型每一轮只处理当前必要上下文；Harness 保存状态、编排工具并控制何时继续。重点不是多调用几次模型，而是每个动作都能被下一次观察纠正。
          - generic [ref=e109]:
            - figure [ref=e110]:
              - img "Workflow 图文：AI Harness Engineering：会写代码，为什么还不够？" [ref=e111]
            - generic [ref=e112]:
              - paragraph [ref=e113]: 运行闭环 · 4 / 5
              - paragraph [ref=e114]: AI Harness Engineering： 会写代码，为什么还不够？
              - paragraph [ref=e115]: 一篇与本集更直接相关的论文，是 AI Harness Engineering。它追问的不是模型能不能写出补丁，而是：为什么模型明明会写代码，仍会看错文件、跑错测试、忘记任务状态，甚至在没有验证时宣布完成？论文的回答是，软件工程能力来自模型、Harness 与环境组成的整个系统。为了把 Harness 的作用单独看清，作者固定模型、任务和仓库，只逐级增加运行时支持。H0 只有任务和代码库；H1 加入工具与测试命令；H2 再加入项目记忆、任务状态和上下文选择；H3 最后加入问题复现、失败归因、确定性检查与验证报告。每次运行还会被打包成可审计的 episode，记录动作、工具、上下文、验证、失败归因、人工介入、维护负担和最终结果。在论文的受控登录验证案例里，四个层级都可能产出可用补丁，但只有 H3 系统性留下复现记录、失败归因、逐项检查和结构化验证报告。它的价值不是证明 Harness 一定让模型写出更多代码，而是把“完成”从一句自我声明，变成有证据的工程结论。这正好支撑 Weng 的 Workflow Automation：执行之后必须观察、验证并据此决定下一步。边界也要说明，这只是一个受控案例和研究框架，不是大规模性能结论。
          - generic [ref=e116]:
            - figure [ref=e117]:
              - img "Workflow 图文：核心价值：把行为变成可追溯证据" [ref=e118]
            - generic [ref=e119]:
              - paragraph [ref=e120]: 运行闭环 · 5 / 5
              - paragraph [ref=e121]: 核心价值：把行为变成可追溯证据
              - paragraph [ref=e122]: 一旦执行和观察被接成闭环，我们就能回放因果链：哪个 diff 让哪组测试通过，哪条命令导致超时，哪次重试没有带来新信息。运行过程因此变成可检查的 artifact，也为后续优化提供证据。但边界必须说清：一个固定的计划执行循环，仍然可能由人写死，也可能空转。它是可部署 Agent 的必要条件，却不是 RSI 的充分条件。
          - heading "Memory：把运行历史写成按需读取的文件" [level=3] [ref=e123]
          - paragraph [ref=e124]: Workflow 解决“怎么跑”，但长任务还要解决“如何记住”。文件系统把中间产物、检查点和任务状态外化，使后续步骤或新的子代理能按需读取，而不必把所有历史塞回上下文窗口。
          - complementary [ref=e125]:
            - paragraph [ref=e126]: 论文拆解｜ACE 与 MCE 分别改什么
            - paragraph [ref=e127]:
              - link "ACE" [ref=e128] [cursor=pointer]:
                - /url: https://arxiv.org/abs/2510.04618
              - text: 把 context 当作会累积的 playbook，而不是反复整体重写的一段 prompt：生成器留下轨迹，反思器从成败中抽规则，整理器以增量条目更新知识，从而保留细节并避免 context collapse。比如“退款金额不对”不应沉淀成一句模糊提醒，而应写成带条件、证据链接和反例的规则。
              - link "MCE" [ref=e129] [cursor=pointer]:
                - /url: https://arxiv.org/abs/2601.21557
              - text: 再加一层：底层 agent 用当前 skill 组织文件与代码，外层 agent 根据历史 skill、执行记录和验证结果改进“如何管理 context”的 skill。前者优化当前输入，后者优化产生输入的方法；两层不能共用同一份训练证据来宣布胜利。
          - generic [ref=e130]:
            - figure [ref=e131]:
              - img "Memory 图文：Workflow 留下的历史，不能只活在聊天里" [ref=e132]
            - generic [ref=e133]:
              - paragraph [ref=e134]: 持久记忆 · 1 / 5
              - paragraph [ref=e135]: Workflow 留下的历史， 不能只活在聊天里
              - paragraph [ref=e136]: 上一集的循环是：计划、执行、观察、再决定。它会留下测试输出、改动差异和失败日志。但这些东西如果只躺在当前对话里，窗口一满，细节就被摘要挤掉；任务重启，也不知道该从哪一步继续。Weng 的第二个模式要解决的不是模型记住更多 token，而是让系统在上下文之外拥有状态。
          - generic [ref=e137]:
            - figure [ref=e138]:
              - img "Memory 图文：把全部历史塞进 Prompt，会发生什么？" [ref=e139]
            - generic [ref=e140]:
              - paragraph [ref=e141]: 持久记忆 · 2 / 5
              - paragraph [ref=e142]: 把全部历史塞进 Prompt，会发生什么？
              - paragraph [ref=e143]: 最直接的做法，是每一轮都把全部历史粘回 prompt。但历史越长，当前任务越容易被挤到边缘；反复摘要又可能丢掉失败细节。更麻烦的是，模型看见一堆文本，却分不清哪条是已验证事实，哪条只是待验证猜测，哪条是已经失败过的尝试。长上下文可以是工作台，却不该是唯一档案室。
          - generic [ref=e144]:
            - figure [ref=e145]:
              - img "Memory 图文：文件系统：把经验变成可查 artifact" [ref=e146]
            - generic [ref=e147]:
              - paragraph [ref=e148]: 持久记忆 · 3 / 5
              - paragraph [ref=e149]: 文件系统：把经验变成可查 artifact
              - paragraph [ref=e150]: 文件系统给出朴素但强的接口：写入、读取、搜索和按需抽取。一个说明性的目录可以让 task.md 保存目标与约束，runs 保存原始工具输出，evidence 保存可引用的失败模式，workspace 保存可编辑实现，status.json 保存后台任务状态。模型不用把所有文件读进来，而是先通过索引定位，再读取最相关的片段。于是记忆从隐式的对话残留，变成可审计的外部状态。
          - generic [ref=e151]:
            - figure [ref=e152]:
              - img "Memory 图文：ACE：不要整体重写，要增量维护 playbook" [ref=e153]
            - generic [ref=e154]:
              - paragraph [ref=e155]: 持久记忆 · 4 / 5
              - paragraph [ref=e156]: ACE：不要整体重写， 要增量维护 playbook
              - paragraph [ref=e157]: ACE 提供了一个具体的 memory 组织思路：把 context 看作不断演化的 playbook。生成器先产生任务轨迹；反思器从成败中提炼可操作的经验；整理器再把带标识的条目增量更新进 playbook。重点是每条经验都拆成可单独定位的字段：规则、证据、适用条件和反例。这样系统能检索一条、引用一条，也能只修正失效的一条，而不必覆盖式重写整段 prompt，从而减轻过度压缩和 context collapse。比如，不要把十次退款异常压成一句“注意退款”；应保留 R-17：币种换算在税费后进行，并连着它的证据、条件与反例。
          - generic [ref=e158]:
            - figure [ref=e159]:
              - img "Memory 图文：文件多，不等于记忆好" [ref=e160]
            - generic [ref=e161]:
              - paragraph [ref=e162]: 持久记忆 · 5 / 5
              - paragraph [ref=e163]: 文件多，不等于记忆好
