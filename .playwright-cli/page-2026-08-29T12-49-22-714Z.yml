              - paragraph [ref=e487]: 到这里，搜索改的都是 harness。再追问一层：循环自己，谁来改进？MetaSkill-Evolve 给出近期答案——快环对当前任务改 Task Skill，看眼前收益；慢环改的是生成和挑选改动的 Meta-Skill，看这套规则能否持续产出好改动。重点不在名字，而在内外层的优化对象、评估节奏必须分开。
