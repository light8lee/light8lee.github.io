              - paragraph [ref=e721]: LALP 的核心不是宣布“低概率步骤都更好”，也不是以局部评分替代正确性检查。它提出一个更窄、可检验的问题：若学生最终需要把局部推理动作重组到新题上，候选数据的排序是否也该主要审视这些动作的局部可支持性？
              - paragraph [ref=e722]: 对长轨迹蒸馏而言，这个问题会暴露那些看似无害的 easy token：结论复读、模板化过渡和长篇解释能让全局平均很漂亮，却不一定提升首次推导的能力。
