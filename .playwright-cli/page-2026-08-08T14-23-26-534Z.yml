                - text: LALP 需要步骤切分和多次局部打分；在比较训练收益时，应并列报告筛选成本、候选数、训练预算与下游泛化，而不只保留最终准确率。
            - heading "与 BLL-Loss 的位置差异" [level=3] [ref=e743]
            - paragraph [ref=e744]: LALP 和下一集的 BLL-Loss 都在追问“token 概率该怎样影响学习”，但操作位置不同：LALP 在训练前的候选轨迹层做选择，减少复读对整条数据分数的掩盖；BLL-Loss 在训练时的 token 层限制极低概率目标对更新的过度牵引。一个调整进入训练的轨迹，另一个调整已进入训练的局部优化力度。
