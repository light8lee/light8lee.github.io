              - heading "它发生在训练时：保留前向计算，调节反向贡献" [level=3] [ref=f1e325]
              - paragraph [ref=f1e326]: 可以把 BLL 的位置读成三步：先像普通 SFT 一样，对所有参考 token 计算条件概率；再对落入低概率区域的 token 限制其梯度牵引；最后将处理后的贡献与其余 token 一起反传到同一组参数。变化不在数据收集时，也不在模型生成答案以后。
              - paragraph [ref=f1e327]: 这个位置解释了它的适用边界：它不能替代数据验证、去重或样本质量控制，也不是推理时的输出修复器。它处理的是“已经决定保留的监督，内部怎样分配优化力度”。
