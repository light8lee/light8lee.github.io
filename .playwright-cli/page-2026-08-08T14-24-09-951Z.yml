              - heading "两段都正确，为什么一段会获得更重的逐字监督？" [level=3] [ref=f1e80]
              - paragraph [ref=f1e81]: 在代码中，变量命名、代码重排和若干等价控制表达可以不同而测试同样通过；在数学证明中，同一结论也可能由不同引理顺序或语言表述得到。任务验证器关心的是语义、执行或最终答案，参考字符串匹配则关心其中一种实现。
              - paragraph [ref=f1e82]: 这张卡不是论文实验复现，而是解释“等价实现”这一动机。它强调低概率的两种来源必须区分：可能是模型没学会关键知识，也可能只是参考答案选了模型不常用的风格。BLL 的立场不是预先判定哪一种，而是避免后一种在极端概率区无限放大。
