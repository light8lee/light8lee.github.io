              - heading "低概率，不等于低价值；更不等于必须无限用力拟合" [level=3] [ref=f1e61]
              - paragraph [ref=f1e62]:
                - text: “模型不会，所以更该教”对于新事实或关键逻辑通常正确；但它默认所有低概率 token 都代表同一种能力缺口。想象参考代码使用
                - code [ref=f1e63]: accumulator_state_v2
                - text: ，学生更倾向等价的
                - code [ref=f1e64]: state
                - text: ：控制流、返回值和测试结果不变，罕见命名本身却可能带来更强的逐字拟合压力。
              - paragraph [ref=f1e65]:
                - text: 论文针对的不是错误示范或 label noise，而是更细的
                - strong [ref=f1e66]: optimization misalignment
                - text: ：专家轨迹可以完全正确，但任务允许不止一种正确实现；训练目标仍会把其中一个实现的每个 token 当作唯一参考。问题是优化力度是否因此过度落在偶发的表面形式上。
          - generic [ref=f1e67]:
            - figure [ref=f1e68]:
              - img "BLL-Loss 论文信息与核心主张的卡片" [ref=f1e69]
            - generic [ref=f1e70]:
              - paragraph [ref=f1e71]: 02 / Paper claim
              - heading "BLL-Loss 改的是局部优化几何，不是训练范式" [level=3] [ref=f1e72]
              - paragraph [ref=f1e73]: 论文题目中的 “Don’t Force the Fit” 指向一个窄问题：正确示范是否意味着每一个 token 都应以无界力度被复刻？BLL-Loss 保留监督学习、保留原训练样本，也不需要额外可学习参数；它只在低概率区域改变单个 token 对更新的最大牵引力。
              - paragraph [ref=f1e74]: 这使它与“先筛掉困难数据”或“重写输出答案”不同。它是一种 SFT 内部的 loss 设计，目标是在保持专家示范信息的同时，为多种等价的推理、代码和表达路径留下更大的空间。
          - generic [ref=f1e75]:
