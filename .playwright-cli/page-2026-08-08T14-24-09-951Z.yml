        - generic [ref=f1e44]:
          - heading "低概率 Token，为什么不该无限主导 SFT 更新？" [level=1] [ref=f1e45]
          - paragraph [ref=f1e46]: 标准 SFT 会逐 token 地提高专家答案的概率。若某个参考 token 对模型非常陌生，负对数似然会给它很强的拟合压力；可是在推理与代码任务中，低概率有时只意味着罕见措辞、变量命名或等价实现路线，而不一定意味着模型缺少决定任务成败的知识。
          - paragraph [ref=f1e47]:
            - text: ICML 2026 Spotlight 论文
            - 'link "Don’t Force the Fit: Bounded Log-Likelihood Loss for Enhanced Reasoning in Large Language Models" [ref=f1e48] [cursor=pointer]':
              - /url: https://openreview.net/forum?id=mTMA9yvsnx
            - text: 提出 BLL-Loss。它保留训练样本，也不按整条回答简单降权；它在低概率 token 区域限制单个 token 对更新的梯度贡献，同时使常规概率区域保持接近最大似然训练的行为。
          - generic [ref=f1e49]:
            - link "OpenReview" [ref=f1e50] [cursor=pointer]:
