              - heading "论文报告的是总体泛化改善，不是“低概率 token 都没用”" [level=3] [ref=f1e360]
              - paragraph [ref=f1e361]: ICML / OpenReview 官方摘要报告：BLL-Loss 不引入额外可学习参数，并在多个模型、多个 reasoning benchmark 上改善泛化。这个总体结论和研究动机一致——模型可以学习专家演示的逻辑关系，而不必由某种罕见写法支配整次更新。
              - paragraph [ref=f1e362]: 但这里必须保留证据边界：当前可直接读取的材料是摘要级，未提供可核验的同版本实验表、阈值、完整损失形态或逐项消融。因此本页不虚构精确增幅，也不把“稳定改善”外推为对所有任务与模型必然有效。
          - generic [ref=f1e363]:
            - figure [ref=f1e364]:
              - img "梯度上界过松过紧的任务边界卡片" [ref=f1e365]
            - generic [ref=f1e366]:
              - paragraph [ref=f1e367]: 09 / Trade-off
              - heading "上界不是越紧越好：陌生也可能是真正的新知识" [level=3] [ref=f1e368]
              - paragraph [ref=f1e369]: 若上界太松，方法会接近标准 SFT；若上界太紧，真正尚未学会的知识也可能因低概率而被压低。代码中的一个标点、结构化输出的字段名、工具调用的参数或数学中的关键符号，都可能表面稀有却决定执行与答案正确性。
              - paragraph [ref=f1e370]: 因此 BLL 不是“给低概率 token 打低价值标签”。它提出的是一个优化权衡：当参考答案存在多种正确实现时，如何防止可替换细节极端地垄断更新，同时不牺牲不可替代的任务信号。具体边界必须通过任务级实验验证。
          - generic [ref=f1e371]:
            - figure [ref=f1e372]:
              - img "低概率不等于低价值的结尾卡片" [ref=f1e373]
            - generic [ref=f1e374]:
              - paragraph [ref=f1e375]: 10 / Reading takeaway
              - heading "低概率不等于低价值；关键是不让它自动拥有无限话语权" [level=3] [ref=f1e376]
              - paragraph [ref=f1e377]: BLL-Loss 对 SFT 的追问并不大而化之：专家答案正确，为什么还要怀疑每个 token？答案是任务评价与逐字模仿的粒度不同。只要答案允许等价实现，低概率就既可能是能力缺口，也可能是风格差异。
              - paragraph [ref=f1e378]: 该方法选择的折中是对低概率 token 的单点牵引设置边界，而不是把难样本或罕见写法从训练中删除。它把“多种正确实现”的问题留在模型可学习的空间里，同时要求我们更认真地验证哪里才是不可替代的任务信号。
          - generic [ref=f1e379]:
            - heading "附录与延伸讨论" [level=2] [ref=f1e380]
            - paragraph [ref=f1e381]: 以下为基于论文动机整理的待验证问题和工程检查项，不是论文已经给出的完整实现或结论。
            - heading "若要评估这类损失，应额外拆开哪些变量？" [level=3] [ref=f1e382]
            - list [ref=f1e383]:
              - listitem [ref=f1e384]:
                - strong [ref=f1e385]: 按 token 功能分组。
                - text: 将可替换的命名/措辞、知识实体、格式字符、结构化字段、代码控制字符等分开统计，避免只用整体低概率分布解释效果。
              - listitem [ref=f1e386]:
                - strong [ref=f1e387]: 并列任务正确性与表面匹配。
                - text: 对代码可记录测试通过与参考字符串相似度；对推理可分开评估最终答案、过程一致性和表达多样性，检验“宽容”是否真正保住正确实现。
              - listitem [ref=f1e388]:
                - strong [ref=f1e389]: 做上界敏感性分析。
                - text: 观察不同边界下的梯度分布、训练稳定性与下游表现，特别查验低概率但关键的 token 是否被系统性压制。
              - listitem [ref=f1e390]:
                - strong [ref=f1e391]: 使用等算力对照。
                - text: 与 label smoothing、focal loss、token reweighting 和数据过滤比较时，保持模型、数据、训练 token 数与调参预算可比，避免把预算差异误读为损失函数收益。
            - heading "与 LALP 的关系" [level=3] [ref=f1e392]
            - paragraph [ref=f1e393]: LALP 处理“多个正确长轨迹中该选哪一条”，通过局部步骤分数减少后文复读对数据选择的影响；BLL 处理“已选定轨迹中的每个 token 应该施加多大更新”，通过有界梯度限制极低概率 token 的过度牵引。两者的共同问题是监督信号的粒度，但一个位于训练前、一个位于训练中，不能互相替代。
            - heading "资料与制作边界" [level=3] [ref=f1e394]
            - list [ref=f1e395]:
              - listitem [ref=f1e396]: 本页只迁入 10 张静态 PNG 场景卡；不包含视频、音频、字幕、HTML 卡片、脚本或其他制作产物。
              - listitem [ref=f1e397]: 正文中关于 BLL 的问题定义、机制性质、parameter-free 特征和跨模型/推理基准的总体结果，均限定在 ICML / OpenReview 官方摘要可支持的范围内。
              - listitem [ref=f1e398]: 精确损失形式、阈值、分段函数、消融细节和数值结果留待可核验的同版本全文；附录建议也与论文事实主张明确分开。
