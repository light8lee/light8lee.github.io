          - heading "4. 代码示例（PyTorch 风格）" [level=2] [ref=e731]
          - code [ref=e735]: "import torch import torch.nn.functional as F def sample_top_k(logits, k): \"\"\"Top-k 采样\"\"\" # 取 top-k 的值与索引 topk_values, topk_indices = torch.topk(logits, k, dim=-1) # 将其他位置置为 -inf min_topk = topk_values[:, -1].unsqueeze(-1) logits = torch.where(logits < min_topk, torch.tensor(float('-inf')), logits) # 重新归一化 probs = F.softmax(logits, dim=-1) return torch.multinomial(probs, 1).squeeze(-1) def sample_top_p(logits, p): \"\"\"Top-p（核）采样\"\"\" # 按概率降序排序 probs = F.softmax(logits, dim=-1) sorted_probs, sorted_indices = torch.sort(probs, descending=True, dim=-1) # 累积概率 cumsum = torch.cumsum(sorted_probs, dim=-1) # 找到累积概率超过 p 的最后一个索引 mask = cumsum - sorted_probs > p sorted_probs[mask] = 0 # 重新归一化 sorted_probs /= sorted_probs.sum(dim=-1, keepdim=True) # 采样（从原始索引） sampled_sorted_idx = torch.multinomial(sorted_probs, 1) return sorted_indices.gather(-1, sampled_sorted_idx).squeeze(-1)"
          - paragraph [ref=e736]:
            - text: Temperature 与 Top-k、Top-p 并不是互相替代的关系，而是
            - strong [ref=e737]: 作用于不同阶段的、可以组合使用的“调节旋钮”
            - text: 。它们在文本生成流程中按先后顺序共同决定了“随机性”与“质量”。
