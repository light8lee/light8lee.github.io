<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1000" viewBox="0 0 2400 1000"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5A6B82"/></marker></defs><rect width="2400" height="1000" fill="#F6F8FB"/><text x="70" y="78" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="42" fill="#172235" font-weight="700" text-anchor="start">KV Replay｜本次观察怎样影响下一次推理</text><text x="70" y="124" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" fill="#5A6B82" font-weight="500" text-anchor="start">红色表示写入；橙色表示持久状态；绿色表示下一次推理可观察到的变化</text><rect x="55" y="220" width="410" height="430" rx="24" fill="#E8F3FF" stroke="#2675D8" stroke-width="3"/><text x="260" y="285" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="27" fill="#2675D8" font-weight="700" text-anchor="middle">1  观察时刻 t</text><text x="260" y="385" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" fill="#203047" font-weight="550" text-anchor="middle">取答案首 token 前 hidden</text><text x="260" y="424" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" fill="#203047" font-weight="550" text-anchor="middle">并保存完整答案 token 序列</text><path d="M465,435 L510,435" stroke="#5A6B82" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="525" y="220" width="410" height="430" rx="24" fill="#FFF1DC" stroke="#D77A16" stroke-width="3"/><text x="730" y="285" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="27" fill="#D77A16" font-weight="700" text-anchor="middle">2  更新前状态</text><text x="730" y="385" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" fill="#203047" font-weight="550" text-anchor="middle">独立问答槽位集合</text><text x="730" y="424" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" fill="#203047" font-weight="550" text-anchor="middle">（更新前）</text><path d="M935,435 L980,435" stroke="#5A6B82" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="995" y="220" width="410" height="430" rx="24" fill="#FFE7E5" stroke="#D14D41" stroke-width="3"/><text x="1200" y="285" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="27" fill="#D14D41" font-weight="700" text-anchor="middle">3  无反向传播写入</text><text x="1200" y="385" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" fill="#203047" font-weight="550" text-anchor="middle">追加新槽位</text><text x="1200" y="424" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" fill="#203047" font-weight="550" text-anchor="middle">或覆盖同地址旧槽位</text><path d="M1405,435 L1450,435" stroke="#5A6B82" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="1465" y="220" width="410" height="430" rx="24" fill="#F0ECFF" stroke="#7656C8" stroke-width="3"/><text x="1670" y="285" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="27" fill="#7656C8" font-weight="700" text-anchor="middle">4  下一次查询 t+1</text><text x="1670" y="385" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" fill="#203047" font-weight="550" text-anchor="middle">首步余弦检索 slot</text><text x="1670" y="424" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" fill="#203047" font-weight="550" text-anchor="middle">命中后锁定 active_slot</text><path d="M1875,435 L1920,435" stroke="#5A6B82" stroke-width="5" fill="none" marker-end="url(#arrow)"/><rect x="1935" y="220" width="410" height="430" rx="24" fill="#E5F7EC" stroke="#278354" stroke-width="3"/><text x="2140" y="285" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="27" fill="#278354" font-weight="700" text-anchor="middle">5  对输出的影响</text><text x="2140" y="385" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" fill="#203047" font-weight="550" text-anchor="middle">每一步给 slot 中下一个</text><text x="2140" y="424" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" fill="#203047" font-weight="550" text-anchor="middle">token 增加 replay bias</text><rect x="55" y="710" width="2290" height="205" rx="24" fill="#172235" stroke="#172235" stroke-width="3"/><text x="90" y="765" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="27" fill="#8FD7D7" font-weight="700" text-anchor="start">读图结论</text><text x="90" y="820" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="27" fill="#FFFFFF" font-weight="500" text-anchor="start">独立槽位避免压缩冲突；首地址选错会导致整段答案回放错误。</text><text x="90" y="875" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="21" fill="#F6C875" font-weight="500" text-anchor="start">精确公式使用正文中的 LaTeX；此图只显示状态流与因果顺序。</text></svg>