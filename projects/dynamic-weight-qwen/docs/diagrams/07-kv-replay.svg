<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1A2740" flood-opacity="0.10"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9AA4B2"/></marker></defs><rect width="1600" height="1000" fill="#F7F9FC"/><rect x="0" y="0" width="1600" height="112" fill="#172235"/><rect x="42" y="25" width="60" height="60" rx="18" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="72" y="66" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="800" fill="#172235" text-anchor="middle">07</text><text x="124" y="52" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="start">KV Replay｜整段答案槽位回放</text><text x="124" y="81" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#C9D3E2" text-anchor="start">每个问答占一个显式槽位：问题隐藏状态作 key，完整答案 token 序列作 value</text><rect x="42" y="142" width="735" height="704" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/><rect x="823" y="142" width="735" height="704" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/><text x="72" y="181" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#24334A" text-anchor="start">A｜推理时：记忆如何参与生成</text><text x="853" y="181" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#24334A" text-anchor="start">B｜观察时：记忆如何无反向传播写入</text><rect x="72" y="218" width="675" height="84" rx="18" fill="#E8F3FF" stroke="#2F73C9" stroke-width="2"/><text x="94" y="248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">查询问题 q&#x27;</text><text x="94" y="275" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">只提供问题，不提供答案</text><path d="M 409 305 L 409 317" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="72" y="320" width="675" height="84" rx="18" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="94" y="350" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">冻结 Qwen</text><rect x="667" y="333" width="64" height="29" rx="14" fill="#FFFFFF" stroke="#657184" stroke-width="1"/><text x="699.0" y="354" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#657184" text-anchor="middle">冻结</text><text x="94" y="377" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">提取问句末隐藏状态 h(q&#x27;)</text><path d="M 409 407 L 409 419" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="72" y="422" width="675" height="84" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="94" y="452" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">内容寻址</text><rect x="667" y="435" width="64" height="29" rx="14" fill="#FFFFFF" stroke="#D77A16" stroke-width="1"/><text x="699.0" y="456" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#D77A16" text-anchor="middle">可变</text><text x="94" y="479" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">simᵢ = cos(h(q&#x27;), keyᵢ)</text><text x="94" y="502" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">选择最相似槽位 i*</text><path d="M 409 509 L 409 521" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="72" y="524" width="675" height="84" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="94" y="554" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">阈值门控</text><text x="94" y="581" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">simᵢ* &lt; τ：完全不干预</text><path d="M 409 611 L 409 623" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="72" y="626" width="675" height="84" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="94" y="656" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">激活整段答案槽位</text><text x="94" y="683" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">按 step 依次取 value[i*, t]</text><path d="M 409 713 L 409 725" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="72" y="728" width="675" height="84" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="94" y="758" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">强 logit 偏置回放</text><text x="94" y="785" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">a₁ → a₂ → … → aₙ</text><rect x="853" y="218" width="675" height="84" rx="18" fill="#E8F3FF" stroke="#2F73C9" stroke-width="2"/><text x="875" y="248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">观察 (问题 q, 答案 a)</text><text x="875" y="275" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">教师答案只用于写入</text><path d="M 1190 305 L 1190 317" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="853" y="320" width="675" height="84" rx="18" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="875" y="350" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">冻结 Qwen 编码问题</text><rect x="1448" y="333" width="64" height="29" rx="14" fill="#FFFFFF" stroke="#657184" stroke-width="1"/><text x="1480.0" y="354" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#657184" text-anchor="middle">冻结</text><text x="875" y="377" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">key = normalize(h(q))</text><path d="M 1190 407 L 1190 419" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="853" y="422" width="675" height="84" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="875" y="452" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">答案 token 化</text><text x="875" y="479" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">value = [a₁, a₂, …, aₙ]</text><path d="M 1190 509 L 1190 521" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="853" y="524" width="675" height="84" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="875" y="554" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">写入或覆盖槽位</text><rect x="1436" y="537" width="76" height="29" rx="14" fill="#FFFFFF" stroke="#D14D41" stroke-width="1"/><text x="1474.0" y="558" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#D14D41" text-anchor="middle">无反传</text><text x="875" y="581" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">memory[i] = {key, value, length}</text><path d="M 1190 611 L 1190 623" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="853" y="626" width="675" height="84" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="875" y="656" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">容量管理</text><text x="875" y="683" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">固定槽位数；满后按策略复用</text><path d="M 1190 713 L 1190 725" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="853" y="728" width="675" height="84" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="875" y="758" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">保存 key/value 张量</text><text x="875" y="785" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">跨 session 精确恢复</text><rect x="42" y="872" width="1516" height="91" rx="22" fill="#172235" stroke="#172235" stroke-width="0"/><text x="68" y="907" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#8FD7D7" text-anchor="start">核心理解</text><text x="174" y="907" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="start">显式槽位避开了词表矩阵串扰，但单一连续语义地址难以区分只差编号的近邻实体。</text><text x="68" y="940" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#F7C77E" text-anchor="start">实验现象</text><text x="174" y="940" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="start">30 条事实：90%；覆盖 70%；6/6 未学习近邻被误触发</text></svg>