<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1A2740" flood-opacity="0.10"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9AA4B2"/></marker></defs><rect width="1600" height="1000" fill="#F7F9FC"/><rect x="0" y="0" width="1600" height="112" fill="#172235"/><rect x="42" y="25" width="60" height="60" rx="18" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="72" y="66" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="800" fill="#172235" text-anchor="middle">06</text><text x="124" y="52" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="start">Vocab EMA｜每个 token 的隐藏原型</text><text x="124" y="81" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#C9D3E2" text-anchor="start">把所有产生同一 token 的上下文压缩成一个指数移动平均原型</text><rect x="42" y="142" width="735" height="704" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/><rect x="823" y="142" width="735" height="704" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/><text x="72" y="181" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#24334A" text-anchor="start">A｜推理时：记忆如何参与生成</text><text x="853" y="181" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#24334A" text-anchor="start">B｜观察时：记忆如何无反向传播写入</text><rect x="72" y="218" width="675" height="84" rx="18" fill="#E8F3FF" stroke="#2F73C9" stroke-width="2"/><text x="94" y="248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">输入上下文</text><text x="94" y="275" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">当前问题 + 已生成前缀</text><path d="M 409 305 L 409 317" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="72" y="320" width="675" height="84" rx="18" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="94" y="350" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">冻结 Qwen</text><rect x="667" y="333" width="64" height="29" rx="14" fill="#FFFFFF" stroke="#657184" stroke-width="1"/><text x="699.0" y="354" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#657184" text-anchor="middle">冻结</text><text x="94" y="377" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">得到隐藏状态 hₜ</text><path d="M 409 407 L 409 419" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="72" y="422" width="675" height="84" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="94" y="452" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">查询 key kₜ</text><text x="94" y="479" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">低秩归一化编码</text><path d="M 409 509 L 409 521" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="72" y="524" width="675" height="84" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="94" y="554" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">与 token 原型比较</text><rect x="667" y="537" width="64" height="29" rx="14" fill="#FFFFFF" stroke="#D77A16" stroke-width="1"/><text x="699.0" y="558" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#D77A16" text-anchor="middle">可变</text><text x="94" y="581" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">score[y] = kₜ · prototype[y]</text><path d="M 409 611 L 409 623" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="72" y="626" width="675" height="84" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="94" y="656" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">原型得分加到 logits</text><text x="94" y="683" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">相似上下文会提升该 token</text><path d="M 409 713 L 409 725" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="72" y="728" width="675" height="84" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="94" y="758" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">选择 token</text><text x="94" y="785" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">没有事实或序列层级的锁定</text><rect x="853" y="218" width="675" height="84" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="875" y="248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">按目标 token 分组</text><text x="875" y="275" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">收集所有 targets == y 的 key</text><path d="M 1190 305 L 1190 317" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="853" y="320" width="675" height="84" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="875" y="350" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">计算当前批均值</text><text x="875" y="377" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">p̂ᵧ = normalize(mean(k | y))</text><path d="M 1190 407 L 1190 419" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="853" y="422" width="675" height="84" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="875" y="452" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">EMA 更新</text><rect x="1436" y="435" width="76" height="29" rx="14" fill="#FFFFFF" stroke="#D14D41" stroke-width="1"/><text x="1474.0" y="456" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#D14D41" text-anchor="middle">无反传</text><text x="875" y="479" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">pᵧ ← m·pᵧ + (1−m)·p̂ᵧ</text><path d="M 1190 509 L 1190 521" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="853" y="524" width="675" height="84" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="875" y="554" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">一个 token 一个原型</text><text x="875" y="581" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">不同事实、位置、语义被压在一起</text><path d="M 1190 611 L 1190 623" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="853" y="626" width="675" height="84" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="875" y="656" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">信息不可逆丢失</text><text x="875" y="683" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">无法知道原型来自哪个问答</text><path d="M 1190 713 L 1190 725" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="853" y="728" width="675" height="84" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="875" y="758" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">保存原型表</text><text x="875" y="785" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">结构简单，但最容易全局漂移</text><rect x="42" y="872" width="1516" height="91" rx="22" fill="#172235" stroke="#172235" stroke-width="0"/><text x="68" y="907" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#8FD7D7" text-anchor="start">核心理解</text><text x="174" y="907" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="start">EMA 的压缩单位是 token，不是事实；它保留了“哪里常出现这个词”，丢掉了“属于哪个回答”。</text><text x="68" y="940" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#F7C77E" text-anchor="start">实验现象</text><text x="174" y="940" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="start">30 条事实：3.3%；MMLU 20 题输出变化 100%，40% → 0%</text></svg>