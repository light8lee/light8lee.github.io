<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1A2740" flood-opacity="0.10"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#9AA4B2"/></marker></defs><rect width="1600" height="1000" fill="#F7F9FC"/><rect x="0" y="0" width="1600" height="112" fill="#172235"/><rect x="42" y="25" width="60" height="60" rx="18" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="72" y="66" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="800" fill="#172235" text-anchor="middle">08</text><text x="124" y="52" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="start">Token kNN｜多门控 token 轨迹记忆</text><text x="124" y="81" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#C9D3E2" text-anchor="start">把答案拆成逐 token 转移；首步严格检索，命中后锁定 group 和时间步</text><rect x="42" y="142" width="735" height="704" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/><rect x="823" y="142" width="735" height="704" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="1"/><text x="72" y="181" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#24334A" text-anchor="start">A｜推理时：记忆如何参与生成</text><text x="853" y="181" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#24334A" text-anchor="start">B｜观察时：记忆如何无反向传播写入</text><rect x="72" y="218" width="675" height="84" rx="18" fill="#E8F3FF" stroke="#2F73C9" stroke-width="2"/><text x="94" y="248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">文本问题 + 可选图片</text><text x="94" y="275" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">同一接口支持 Qwen 与 Qwen-VL</text><path d="M 409 305 L 409 317" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="72" y="320" width="675" height="84" rx="18" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="94" y="350" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">冻结模型提取查询状态</text><rect x="667" y="333" width="64" height="29" rx="14" fill="#FFFFFF" stroke="#657184" stroke-width="1"/><text x="699.0" y="354" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#657184" text-anchor="middle">冻结</text><text x="94" y="377" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">query = normalize(h_last)</text><path d="M 409 407 L 409 419" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="72" y="422" width="675" height="84" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="94" y="452" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">首步四重门控</text><rect x="637" y="435" width="94" height="29" rx="14" fill="#FFFFFF" stroke="#16858B" stroke-width="1"/><text x="684.0" y="456" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#16858B" text-anchor="middle">拒绝优先</text><text x="94" y="479" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">语义阈值 + 实体标签</text><text x="94" y="502" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">稀有 4-token 指纹 + 视觉签名</text><path d="M 409 509 L 409 521" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="72" y="524" width="675" height="84" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="94" y="554" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">选择起始转移</text><rect x="667" y="537" width="64" height="29" rx="14" fill="#FFFFFF" stroke="#D77A16" stroke-width="1"/><text x="699.0" y="558" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#D77A16" text-anchor="middle">可变</text><text x="94" y="581" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">top-k 地址投票；命中 group g</text><path d="M 409 611 L 409 623" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="72" y="626" width="675" height="84" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="94" y="656" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">锁定 group + step</text><text x="94" y="683" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">后续只检索 g 内第 t 个转移</text><path d="M 409 713 L 409 725" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="72" y="728" width="675" height="84" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="94" y="758" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">局部 logit 偏置</text><text x="94" y="785" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">逐 token 生成；未命中时原模型不变</text><rect x="853" y="218" width="675" height="84" rx="18" fill="#E8F3FF" stroke="#2F73C9" stroke-width="2"/><text x="875" y="248" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">观察 (问题/图片, 答案)</text><text x="875" y="275" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">教师 mask 标记答案位置</text><path d="M 1190 305 L 1190 317" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="853" y="320" width="675" height="84" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="875" y="350" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">构造每步转移</text><text x="875" y="377" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">keyₜ = hₜ₋₁，valueₜ = answer tokenₜ</text><path d="M 1190 407 L 1190 419" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="853" y="422" width="675" height="84" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="875" y="452" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">附加身份与上下文</text><text x="875" y="479" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">entity、prompt 指纹、visual signature</text><path d="M 1190 509 L 1190 521" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="853" y="524" width="675" height="84" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="875" y="554" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">写入轨迹记录</text><rect x="1436" y="537" width="76" height="29" rx="14" fill="#FFFFFF" stroke="#D14D41" stroke-width="1"/><text x="1474.0" y="558" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#D14D41" text-anchor="middle">无反传</text><text x="875" y="581" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">{key, value, group, step, gates}</text><path d="M 1190 611 L 1190 623" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="853" y="626" width="675" height="84" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="875" y="656" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">安全覆盖</text><text x="875" y="683" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">只有同实体/同上下文才允许删除旧 group</text><path d="M 1190 713 L 1190 725" stroke="#9AA4B2" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="853" y="728" width="675" height="84" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="875" y="758" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">持久化与拒绝</text><text x="875" y="785" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#4A5567" text-anchor="start">Safetensors；门控失败则零干预</text><rect x="42" y="872" width="1516" height="91" rx="22" fill="#172235" stroke="#172235" stroke-width="0"/><text x="68" y="907" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#8FD7D7" text-anchor="start">核心理解</text><text x="174" y="907" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="start">成功来自“目标明确 + 地址可分 + 轨迹连续 + 能够拒绝”；它是外显快记忆，不是主干知识内化。</text><text x="68" y="940" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#F7C77E" text-anchor="start">实验现象</text><text x="174" y="940" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="500" fill="#FFFFFF" text-anchor="start">180 条随机事实：360/360；近邻拒绝 90/90；三种模型 30 条实验均 100%</text></svg>