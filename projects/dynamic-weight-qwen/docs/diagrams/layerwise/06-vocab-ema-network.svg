<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#9AA4B2"/></marker></defs><rect width="2400" height="1600" fill="#F7F9FC"/><rect x="0" y="0" width="2400" height="125" fill="#172235"/><rect x="38" y="25" width="72" height="72" rx="19" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="74" y="73" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="800" fill="#172235" text-anchor="middle">06</text><text x="138" y="58" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="750" fill="#FFFFFF" text-anchor="start">Vocab EMA｜网络层级计算顺序</text><text x="138" y="92" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#C9D3E2" text-anchor="start">从输入、每个 Decoder Layer、插件 hook 到下一个 token 的完整前向路径</text><rect x="40" y="150" width="2320" height="260" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="68" y="194" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">① 全局前向路径（红色节点是本方法真正接入的位置）</text><rect x="74" y="242" width="250" height="105" rx="17" fill="#E8F3FF" stroke="#2675D8" stroke-width="2"/><text x="199.0" y="305" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">token ids</text><path d="M324,294 L349,294" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="358" y="242" width="250" height="105" rx="17" fill="#E8F3FF" stroke="#2675D8" stroke-width="2"/><text x="483.0" y="305" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">embedding</text><path d="M608,294 L633,294" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="642" y="242" width="250" height="105" rx="17" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="767.0" y="305" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">decoder blocks ×L</text><path d="M892,294 L917,294" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="926" y="242" width="250" height="105" rx="17" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="1051.0" y="305" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">final RMSNorm</text><path d="M1176,294 L1201,294" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1210" y="242" width="250" height="105" rx="17" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="1335.0" y="305" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">LM Head linear</text><path d="M1460,294 L1485,294" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1494" y="242" width="250" height="105" rx="17" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="1619.0" y="305" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">EMA prototype hook</text><path d="M1744,294 L1769,294" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1778" y="242" width="250" height="105" rx="17" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="1903.0" y="305" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">softmax/greedy</text><path d="M2028,294 L2053,294" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="2062" y="242" width="250" height="105" rx="17" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="2187.0" y="305" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">next token</text><rect x="40" y="445" width="1510" height="785" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="68" y="487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">② 单个 Qwen Decoder Layer 的精确前向顺序</text><rect x="75" y="520" width="300" height="190" rx="18" fill="#E8F3FF" stroke="#2675D8" stroke-width="2"/><text x="97" y="555" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">1. 层输入 Xℓ</text><text x="97" y="588" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">[B,T,d]</text><path d="M375,615.0 L408,615.0" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="420" y="520" width="300" height="190" rx="18" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="442" y="555" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">2. input RMSNorm</text><text x="442" y="588" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">U=RMSNorm(Xℓ)</text><path d="M720,615.0 L753,615.0" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="765" y="520" width="300" height="190" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="787" y="555" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">3. Q/K/V + RoPE</text><text x="787" y="588" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">Q=UWq, K=UWk, V=UWv</text><text x="787" y="617" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">Q/K norm → rotary position</text><path d="M1065,615.0 L1098,615.0" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1110" y="520" width="300" height="190" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="1132" y="555" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">4. Causal GQA</text><text x="1132" y="588" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">A=softmax(QKᵀ/√dh+mask)V</text><text x="1132" y="617" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">O=A Wo</text><path d="M1260.0,710 L1260.0,778" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1110" y="790" width="300" height="190" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="1132" y="825" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">5. Attention residual</text><text x="1132" y="858" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">R=Xℓ+O</text><path d="M1110,885.0 L1077,885.0" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="765" y="790" width="300" height="190" rx="18" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="787" y="825" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">6. post-attn RMSNorm</text><text x="787" y="858" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">M=RMSNorm(R)</text><path d="M765,885.0 L732,885.0" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="420" y="790" width="300" height="190" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="442" y="825" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">7. SwiGLU MLP</text><text x="442" y="858" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">G=SiLU(MWgate)⊙(MWup)</text><text x="442" y="887" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">F=G Wdown</text><path d="M420,885.0 L387,885.0" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="75" y="790" width="300" height="190" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="97" y="825" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">8. MLP residual</text><text x="97" y="858" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">Hℓ=R+F</text><text x="97" y="887" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">标准 block 输出</text><rect x="75" y="1045" width="1335" height="125" rx="18" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="97" y="1080" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">Hℓ 继续进入下一层；插件不在 block 内</text><text x="97" y="1113" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#49566A" text-anchor="start">output methods: 重复 L 层后，final RMSNorm → LM Head → hook</text><rect x="1580" y="445" width="780" height="785" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="1610" y="487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">③ 本方法 hook 内部的顺序</text><rect x="1610" y="525" width="720" height="112" rx="18" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="1632" y="560" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">① Final hidden H</text><text x="1632" y="593" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">冻结 Qwen 产生 [B,T,d]</text><path d="M1970,637 L1970,649" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1610" y="657" width="720" height="112" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="1632" y="692" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">② 低秩 query K</text><text x="1632" y="725" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">K=norm(tanh(RMS(H)E))</text><path d="M1970,769 L1970,781" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1610" y="789" width="720" height="112" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="1632" y="824" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">③ 原型表读取</text><text x="1632" y="857" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">score=KP</text><text x="1632" y="886" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">P:[r,V]，每列一个 token 原型</text><path d="M1970,901 L1970,913" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1610" y="921" width="720" height="112" rx="18" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="1632" y="956" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">④ 基础 LM Head</text><text x="1632" y="989" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">Lbase=HWlmᵀ</text><path d="M1970,1033 L1970,1045" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1610" y="1053" width="720" height="112" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="1632" y="1088" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">⑤ 合并</text><text x="1632" y="1121" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">L&#x27;=Lbase+αscore</text><rect x="40" y="1260" width="2320" height="280" rx="22" fill="#172235" stroke="#172235" stroke-width="0"/><text x="68" y="1302" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#8FD7D7" text-anchor="start">④ 一次生成调用中的控制顺序</text><rect x="70" y="1340" width="292" height="82" rx="16" fill="#24334A" stroke="#53637B" stroke-width="1"/><text x="216.0" y="1390" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">inference_mode</text><path d="M362,1381 L383,1381" fill="none" stroke="#7B8AA1" stroke-width="4" marker-end="url(#arr)"/><rect x="390" y="1340" width="292" height="82" rx="16" fill="#24334A" stroke="#53637B" stroke-width="1"/><text x="536.0" y="1390" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">set query/context</text><path d="M682,1381 L703,1381" fill="none" stroke="#7B8AA1" stroke-width="4" marker-end="url(#arr)"/><rect x="710" y="1340" width="292" height="82" rx="16" fill="#24334A" stroke="#53637B" stroke-width="1"/><text x="856.0" y="1390" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">begin_generation</text><path d="M1002,1381 L1023,1381" fill="none" stroke="#7B8AA1" stroke-width="4" marker-end="url(#arr)"/><rect x="1030" y="1340" width="292" height="82" rx="16" fill="#24334A" stroke="#53637B" stroke-width="1"/><text x="1176.0" y="1390" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">model.generate loop</text><path d="M1322,1381 L1343,1381" fill="none" stroke="#7B8AA1" stroke-width="4" marker-end="url(#arr)"/><rect x="1350" y="1340" width="292" height="82" rx="16" fill="#24334A" stroke="#53637B" stroke-width="1"/><text x="1496.0" y="1390" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">plugin hook / token</text><path d="M1642,1381 L1663,1381" fill="none" stroke="#7B8AA1" stroke-width="4" marker-end="url(#arr)"/><rect x="1670" y="1340" width="292" height="82" rx="16" fill="#24334A" stroke="#53637B" stroke-width="1"/><text x="1816.0" y="1390" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">end_generation</text><path d="M1962,1381 L1983,1381" fill="none" stroke="#7B8AA1" stroke-width="4" marker-end="url(#arr)"/><rect x="1990" y="1340" width="292" height="82" rx="16" fill="#24334A" stroke="#53637B" stroke-width="1"/><text x="2136.0" y="1390" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">clear transient state</text><text x="68" y="1485" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="600" fill="#F6C875" text-anchor="start">冻结边界：model.eval()；所有主干 parameter.requires_grad=False；observe/generate 均处于 torch.inference_mode()。</text></svg>