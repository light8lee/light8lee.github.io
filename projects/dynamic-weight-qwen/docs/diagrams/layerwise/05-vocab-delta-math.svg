<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#9AA4B2"/></marker></defs><rect width="2400" height="1600" fill="#F7F9FC"/><rect x="0" y="0" width="2400" height="125" fill="#172235"/><rect x="38" y="25" width="72" height="72" rx="19" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="74" y="73" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="800" fill="#172235" text-anchor="middle">05</text><text x="138" y="58" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="750" fill="#FFFFFF" text-anchor="start">Vocab Delta｜底层公式与状态</text><text x="138" y="92" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#C9D3E2" text-anchor="start">逐步读取公式、原位写入公式、张量形状及失败边界</text><rect x="40" y="165" width="750" height="1270" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="68" y="211" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">A｜推理读取（forward）</text><rect x="65" y="245" width="700" height="205" rx="18" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="87" y="280" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">基础路径</text><text x="87" y="313" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Lbase=LMHead(H)</text><path d="M415,450 L415,465" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="471" width="700" height="205" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="87" y="506" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">key 编码</text><text x="87" y="539" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">K=φ(H)∈ℝ[B,T,r]</text><path d="M415,676 L415,691" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="697" width="700" height="205" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="87" y="732" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">读取快映射</text><text x="87" y="765" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">P=KW∈ℝ[B,T,V]</text><path d="M415,902 L415,917" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="923" width="700" height="205" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="87" y="958" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">融合</text><text x="87" y="991" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">L&#x27;=Lbase+αP</text><path d="M415,1128 L415,1143" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="1149" width="700" height="205" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="87" y="1184" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">选择 next token</text><text x="87" y="1217" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">argmax / configured decoding</text><rect x="825" y="165" width="750" height="1270" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="853" y="211" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">B｜观察写入（no_grad）</text><rect x="850" y="245" width="700" height="205" rx="18" fill="#E8F3FF" stroke="#2675D8" stroke-width="2"/><text x="872" y="280" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">选中教师样本</text><text x="872" y="313" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Ks:[N,r]；y:[N]</text><text x="872" y="342" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">N=答案 token 数</text><path d="M1200,450 L1200,465" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="850" y="471" width="700" height="205" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="872" y="506" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">构造目标值</text><text x="872" y="539" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">V=one_hot(y)∈ℝ[N,V]</text><path d="M1200,676 L1200,691" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="850" y="697" width="700" height="205" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="872" y="732" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">预测已有映射</text><text x="872" y="765" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">P=KsW∈ℝ[N,V]</text><path d="M1200,902 L1200,917" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="850" y="923" width="700" height="205" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="872" y="958" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">局部输出误差</text><text x="872" y="991" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Eout=V−P</text><text x="872" y="1020" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">误差不传入 Qwen</text><path d="M1200,1128 L1200,1143" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="850" y="1149" width="700" height="205" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="872" y="1184" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">Delta 更新</text><text x="872" y="1217" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">W←(1−λ)W+(η·reward/N)KsᵀEout</text><rect x="1610" y="165" width="750" height="1270" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="1638" y="211" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">C｜状态、形状与边界</text><rect x="1635" y="245" width="700" height="205" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="1657" y="280" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">状态</text><text x="1657" y="313" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Wdelta:[r,V]</text><path d="M1985,450 L1985,465" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1635" y="471" width="700" height="205" rx="18" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="1657" y="506" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">梯度边界</text><text x="1657" y="539" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Ks 已 detach</text><text x="1657" y="568" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Eout 只用于闭式局部更新</text><path d="M1985,676 L1985,691" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1635" y="697" width="700" height="205" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="1657" y="732" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">与 Hebbian 差别</text><text x="1657" y="765" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">写入前先减掉当前预测</text><text x="1657" y="794" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">允许纠正而非只累加</text><path d="M1985,902 L1985,917" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1635" y="923" width="700" height="205" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="1657" y="958" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">容量瓶颈</text><text x="1657" y="991" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">一个有限秩 W 服务全部上下文</text><text x="1657" y="1020" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">一次纠错可能覆盖别的 key</text><path d="M1985,1128 L1985,1143" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1635" y="1149" width="700" height="205" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="1657" y="1184" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">实验现象</text><text x="1657" y="1217" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">事实 0%</text><text x="1657" y="1246" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">MMLU 输出变化 25%</text><rect x="40" y="1470" width="2320" height="90" rx="20" fill="#172235" stroke="#172235" stroke-width="0"/><text x="70" y="1513" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#8FD7D7" text-anchor="start">结论</text><text x="170" y="1513" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" fill="#FFFFFF" text-anchor="start">Delta 有明确误差信号，但共享低秩矩阵仍是容量瓶颈；冻结 key 空间也未为闭式写入优化。</text><text x="70" y="1544" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#F6C875" text-anchor="start">符号</text><text x="170" y="1544" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#D7DFEA" text-anchor="start">B=batch，T=sequence length，d=hidden size，r=fast rank，V=vocab size，M=memory slots，N=stored transitions。</text></svg>