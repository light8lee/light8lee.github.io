<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#9AA4B2"/></marker></defs><rect width="2400" height="1600" fill="#F7F9FC"/><rect x="0" y="0" width="2400" height="125" fill="#172235"/><rect x="38" y="25" width="72" height="72" rx="19" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="74" y="73" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="800" fill="#172235" text-anchor="middle">00</text><text x="138" y="58" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="750" fill="#FFFFFF" text-anchor="start">Qwen 公共骨架｜插件到底插在哪里</text><text x="138" y="92" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#C9D3E2" text-anchor="start">所有八种方法共享同一个冻结主干；只在 decoder block 输出或 LM Head 输出挂 hook</text><rect x="40" y="160" width="2320" height="245" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="70" y="205" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#24334A" text-anchor="start">模型级顺序</text><rect x="68" y="250" width="245" height="105" rx="17" fill="#E8F3FF" stroke="#2675D8" stroke-width="2"/><text x="190" y="292" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">input_ids</text><text x="190" y="320" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">[B,T]</text><path d="M313,302 L344,302" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="354" y="250" width="245" height="105" rx="17" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="476" y="292" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">token embedding</text><text x="476" y="320" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">[B,T,d]</text><path d="M599,302 L630,302" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="640" y="250" width="245" height="105" rx="17" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="762" y="292" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">Decoder Layer 0</text><path d="M885,302 L916,302" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="926" y="250" width="245" height="105" rx="17" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="1048" y="292" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">…</text><path d="M1171,302 L1202,302" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1212" y="250" width="245" height="105" rx="17" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="1334" y="292" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">Decoder Layer L−1</text><path d="M1457,302 L1488,302" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1498" y="250" width="245" height="105" rx="17" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="1620" y="292" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">final RMSNorm</text><path d="M1743,302 L1774,302" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1784" y="250" width="245" height="105" rx="17" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="1906" y="292" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">LM Head</text><text x="1906" y="320" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">[B,T,V]</text><path d="M2029,302 L2060,302" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="2070" y="250" width="245" height="105" rx="17" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="2192" y="292" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="650" fill="#24334A" text-anchor="middle">decode token</text><rect x="40" y="445" width="1510" height="785" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="68" y="487" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">② 单个 Qwen Decoder Layer 的精确前向顺序</text><rect x="75" y="520" width="300" height="190" rx="18" fill="#E8F3FF" stroke="#2675D8" stroke-width="2"/><text x="97" y="555" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">1. 层输入 Xℓ</text><text x="97" y="588" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">[B,T,d]</text><path d="M375,615.0 L408,615.0" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="420" y="520" width="300" height="190" rx="18" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="442" y="555" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">2. input RMSNorm</text><text x="442" y="588" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">U=RMSNorm(Xℓ)</text><path d="M720,615.0 L753,615.0" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="765" y="520" width="300" height="190" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="787" y="555" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">3. Q/K/V + RoPE</text><text x="787" y="588" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">Q=UWq, K=UWk, V=UWv</text><text x="787" y="617" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">Q/K norm → rotary position</text><path d="M1065,615.0 L1098,615.0" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1110" y="520" width="300" height="190" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="1132" y="555" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">4. Causal GQA</text><text x="1132" y="588" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">A=softmax(QKᵀ/√dh+mask)V</text><text x="1132" y="617" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">O=A Wo</text><path d="M1260.0,710 L1260.0,778" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1110" y="790" width="300" height="190" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="1132" y="825" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">5. Attention residual</text><text x="1132" y="858" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">R=Xℓ+O</text><path d="M1110,885.0 L1077,885.0" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="765" y="790" width="300" height="190" rx="18" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="787" y="825" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">6. post-attn RMSNorm</text><text x="787" y="858" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">M=RMSNorm(R)</text><path d="M765,885.0 L732,885.0" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="420" y="790" width="300" height="190" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="442" y="825" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">7. SwiGLU MLP</text><text x="442" y="858" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">G=SiLU(MWgate)⊙(MWup)</text><text x="442" y="887" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">F=G Wdown</text><path d="M420,885.0 L387,885.0" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="75" y="790" width="300" height="190" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="97" y="825" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">8. MLP residual</text><text x="97" y="858" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">Hℓ=R+F</text><text x="97" y="887" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" fill="#49566A" text-anchor="start">标准 block 输出</text><rect x="75" y="1045" width="1335" height="125" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="97" y="1080" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#172235" text-anchor="start">★ 插件 hook：就在 Hℓ 返回后</text><text x="97" y="1113" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#49566A" text-anchor="start">residual methods: Hℓ → adapter → H&#x27;ℓ</text><rect x="1580" y="445" width="780" height="785" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="1610" y="488" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#24334A" text-anchor="start">两类 hook 位置</text><rect x="1610" y="540" width="720" height="180" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="1632" y="575" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#172235" text-anchor="start">A. residual hook</text><text x="1632" y="608" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#49566A" text-anchor="start">每个选中 block 返回 Hℓ 后</text><text x="1632" y="637" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#49566A" text-anchor="start">先执行 adapter，再喂给下一层</text><rect x="1610" y="765" width="720" height="180" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="1632" y="800" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#172235" text-anchor="start">B. LM Head hook</text><text x="1632" y="833" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#49566A" text-anchor="start">final RMSNorm 已完成</text><text x="1632" y="862" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#49566A" text-anchor="start">先算基础 logits，再叠加 memory logits/bias</text><rect x="1610" y="990" width="720" height="180" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="1632" y="1025" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#172235" text-anchor="start">共同的观察路径</text><text x="1632" y="1058" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#49566A" text-anchor="start">chat template → teacher mask</text><text x="1632" y="1087" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#49566A" text-anchor="start">完整 forward(use_cache=False) → hook 写入</text><rect x="40" y="1260" width="2320" height="280" rx="22" fill="#172235" stroke="#172235" stroke-width="0"/><text x="70" y="1310" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#8FD7D7" text-anchor="start">关键边界</text><text x="70" y="1360" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">• 主干慢权重：冻结，不更新，不产生 grad。</text><text x="70" y="1405" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">• 快权重/记忆张量：requires_grad=False，但允许在 torch.no_grad() 中 copy_/add_/mul_ 原位改变。</text><text x="70" y="1450" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">• residual 两种方法改变隐藏流；其余六种只在最终 logits 处读取/写入，不改 Decoder 内部激活。</text><text x="70" y="1495" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">• 保存时只写插件状态到 Safetensors；重新加载 Qwen 后再恢复插件，因此可以跨 session。</text></svg>