r)"/><rect x="1988" y="265" width="292" height="145" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="2010" y="300" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172235" text-anchor="start">multimodal embeds</text><text x="2010" y="333" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#49566A" text-anchor="start">混合序列 inputs_embeds</text><text x="2010" y="362" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#49566A" text-anchor="start">送入 Qwen text decoder</text><rect x="70" y="565" width="1445" height="105" rx="18" fill="#E8F3FF" stroke="#2675D8" stroke-width="2"/><text x="92" y="600" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">Vision block 输入 Zv</text><text x="92" y="633" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">[Nv,dv]；packed variable-length sequence</text><path d="M792,670 L792,677" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="70" y="681" width="1445" height="105" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="92" y="716" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">视觉注意力残差</text><text x="92" y="749" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">Z1=Zv+Attn(LN1(Zv), axial RoPE)</text><text x="92" y="778" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">attention 为 non-causal</text><path d="M792,786 L792,793" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="70" y="797" width="1445" height="105" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="92" y="832" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">视觉 MLP 残差</text><text x="92" y="865" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">Z2=Z1+MLP(LN2(Z1))</text><path d="M792,902 L792,909" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="70" y="913" width="1445" height="105" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="92" y="948" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">DeepStack 抽取</text><text x="92" y="981" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">若 layer∈deepstack_visual_indexes</text><text x="92" y="1010" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">Z2→额外 PatchMerger→dtext</text><path d="M792,1018 L792,1025" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="70" y="1029" width="1445" height="105" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="92" y="1064" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">早层视觉注入</text><text x="92" y="1097" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">text layer k: H[visual_mask]+=deepstack[k]</text><text x="92" y="1126" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">主 merger 输出用于初始 masked_scatter</text><rect x="1610" y="565" width="720" height="105" rx="18" fill="#E8F3FF" stroke="#2675D8" stroke-width="2"/><text x="1632