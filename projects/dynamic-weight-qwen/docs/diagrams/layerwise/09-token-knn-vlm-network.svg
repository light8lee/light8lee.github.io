<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#9AA4B2"/></marker></defs><rect width="2400" height="1600" fill="#F7F9FC"/><rect x="0" y="0" width="2400" height="125" fill="#172235"/><rect x="38" y="25" width="72" height="72" rx="19" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="74" y="73" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="800" fill="#172235" text-anchor="middle">09</text><text x="138" y="58" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="750" fill="#FFFFFF" text-anchor="start">Token kNN + Qwen3-VL｜视觉网络逐层路径</text><text x="138" y="92" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#C9D3E2" text-anchor="start">视觉编码器主路径与 8×8 RGB 拒绝门控是两条并行路径；二者在 LM Head hook 会合</text><rect x="40" y="155" width="2320" height="315" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="68" y="200" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">① 视觉主干：图片如何变成语言模型中的视觉 token</text><rect x="40" y="500" width="1510" height="650" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="68" y="545" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">② 单个 Vision Transformer Block 与 DeepStack</text><rect x="1580" y="500" width="780" height="650" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="1608" y="545" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">③ 文本 Decoder 与 token kNN hook</text><rect x="40" y="1180" width="2320" height="350" rx="24" fill="#172235" stroke="#172235" stroke-width="0"/><text x="68" y="1225" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#8FD7D7" text-anchor="start">④ 独立视觉签名门控：不是视觉主干参数，也不反向传播</text><rect x="68" y="265" width="292" height="145" rx="18" fill="#E8F3FF" stroke="#2675D8" stroke-width="2"/><text x="90" y="300" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172235" text-anchor="start">pixel_values</text><text x="90" y="333" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#49566A" text-anchor="start">processor 动态分辨率</text><path d="M360,337 L380,337" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="388" y="265" width="292" height="145" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="410" y="300" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172235" text-anchor="start">Conv3D Patch Embed</text><text x="410" y="333" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#49566A" text-anchor="start">kernel = stride</text><text x="410" y="362" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#49566A" text-anchor="start">[temporal, patch, patch]</text><path d="M680,337 L700,337" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="708" y="265" width="292" height="145" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="730" y="300" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172235" text-anchor="start">位置编码</text><text x="730" y="333" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#49566A" text-anchor="start">learned 2D pos + axial RoPE</text><path d="M1000,337 L1020,337" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect 