35" text-anchor="start">Final RMSNorm + LM Head</text><text x="1632" y="981" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">得到 base logits [B,T,V]</text><path d="M1970,1018 L1970,1025" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1610" y="1029" width="720" height="105" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="1632" y="1064" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">Token kNN hook</text><text x="1632" y="1097" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">hidden 寻址；context signature 拒绝</text><text x="1632" y="1126" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">命中后只给 winner token 加 β</text><rect x="70" y="1280" width="410" height="155" rx="18" fill="#E8F3FF" stroke="#2675D8" stroke-width="2"/><text x="92" y="1315" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">原始 PIL image</text><text x="92" y="1348" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">与 processor 主路径使用同一输入图</text><path d="M480,1356 L515,1356" fill="none" stroke="#7B8AA1" stroke-width="4" marker-end="url(#arr)"/><rect x="525" y="1280" width="410" height="155" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="547" y="1315" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">确定性压缩</text><text x="547" y="1348" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">RGB → resize 8×8 → channel scale 到 [−1,1]</text><path d="M935,1356 L970,1356" fill="none" stroke="#7B8AA1" stroke-width="4" marker-end="url(#arr)"/><rect x="980" y="1280" width="410" height="155" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="1002" y="1315" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">形成签名 cq</text><text x="1002" y="1348" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">flatten → ℝ[192] → L2 normalize</text><path d="M1390,1356 L1425,1356" fill="none" stroke="#7B8AA1" stroke-width="4" marker-end="url(#arr)"/><rect x="1435" y="1280" width="410" height="155" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="1457" y="1315" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">首步 context gate</text><text x="1457" y="1348" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">只保留 has_context 且 ciᵀcq≥τc</text><text x="1457" y="1377" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">实验校准 τc=0.999</text><path d="M1845,1356 L1880,1356" fill="none" stroke="#7B8AA1" stroke-width="4" marker-end="url(#arr)"/><rect x="1890" y="1280" width="410" height="155" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="1912" y="1315" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#172235" text-anchor="start">门控结果</text><text x="1912" y="1348" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">候选为空：return base logits</text><text x="1912" y="1377" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#49566A" text-anchor="start">候选存在：继续 entity/lexical/semantic 检索</text><text x="70" y="1490" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#F6C875" text-anchor="start">注意：视觉签名只用于“是不是同一/近似图片”的拒绝门控；真正的问句 hidden 已包含 Qwen3-VL 视觉主干信息。当前 8×8 RGB 签名属于实例级记忆，不代表视觉概念学习。</text></svg>