<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#9AA4B2"/></marker></defs><rect width="2400" height="1600" fill="#F7F9FC"/><rect x="0" y="0" width="2400" height="125" fill="#172235"/><rect x="38" y="25" width="72" height="72" rx="19" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="74" y="73" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="800" fill="#172235" text-anchor="middle">02</text><text x="138" y="58" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="750" fill="#FFFFFF" text-anchor="start">Residual Oja｜底层公式与状态</text><text x="138" y="92" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#C9D3E2" text-anchor="start">逐步读取公式、原位写入公式、张量形状及失败边界</text><rect x="40" y="165" width="750" height="1270" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="68" y="211" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">A｜推理读取（forward）</text><rect x="65" y="245" width="700" height="205" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="87" y="280" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">归一化隐藏状态</text><text x="87" y="313" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">N = RMS(H)</text><text x="87" y="342" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">N:[B,T,d]</text><path d="M415,450 L415,465" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="471" width="700" height="205" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="87" y="506" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">低秩编码</text><text x="87" y="539" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Z = norm(tanh(NE))</text><text x="87" y="568" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">E:[d,r]；Z:[B,T,r]</text><path d="M415,676 L415,691" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="697" width="700" height="205" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="87" y="732" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">读取</text><text x="87" y="765" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">D = ZWoja</text><text x="87" y="794" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Woja:[r,d]</text><path d="M415,902 L415,917" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="923" width="700" height="205" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="87" y="958" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">注入</text><text x="87" y="991" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Hout = H + αD</text><path d="M415,1128 L415,1143" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="1149" width="700" height="205" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="87" y="1184" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">继续冻结前向</text><text x="87" y="1217" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Hout → next decoder block</text><rect x="825" y="165" width="750" height="1270" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="853" y="211" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">B｜观察写入（no_grad）</text><rect x="850" y="245" width="700" height="205" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="872" y="280" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">局部活动统计</text><text x="872" y="313" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">p=mean(Z)∈ℝ[r]</text><text x="872" y="342" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">s=tanh(mean(N))∈ℝ[d]</text><path d="M1200,450 L1200,465" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="850" y="471" width="700" height="205" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="872" y="506" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">步长</text><text x="872" y="539" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">γ=η·reward·novelty</text><path d="M1200,676 L1200,691" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="850" y="697" width="700" height="205" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="872" y="732" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">正相关项</text><text x="872" y="765" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Ahebb = p⊗s</text><path d="M1200,902 L1200,917" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="850" y="923" width="700" height="205" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="872" y="958" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">Oja 抑制项</text><text x="872" y="991" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Aoja = Ahebb − W ⊙ 1r(s⊙s)ᵀ</text><text x="872" y="1020" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">每个输出维按 post² 抑制</text><path d="M1200,1128 L1200,1143" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="850" y="1149" width="700" height="205" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="872" y="1184" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">最终更新</text><text x="872" y="1217" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">W←(1−λ)W+γAoja</text><text x="872" y="1246" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">再做逐行范数裁剪</text><rect x="1610" y="165" width="750" height="1270" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="1638" y="211" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">C｜状态、形状与边界</text><rect x="1635" y="245" width="700" height="205" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="1657" y="280" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">状态形状</text><text x="1657" y="313" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">W:[r,d] / selected layer</text><text x="1657" y="342" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">trace:[r]</text><path d="M1985,450 L1985,465" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1635" y="471" width="700" height="205" rx="18" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="1657" y="506" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">冻结部分</text><text x="1657" y="539" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Attention、MLP、LM Head 全冻结</text><path d="M1985,676 L1985,691" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1635" y="697" width="700" height="205" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="1657" y="732" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">与 Hebbian 唯一区别</text><text x="1657" y="765" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">仅写入公式增加 −W⊙post²</text><text x="1657" y="794" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">读取路径完全相同</text><path d="M1985,902 L1985,917" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1635" y="923" width="700" height="205" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="1657" y="958" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">解决的问题</text><text x="1657" y="991" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">抑制强连接继续膨胀</text><text x="1657" y="1020" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">提升数值稳定性</text><path d="M1985,1128 L1985,1143" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1635" y="1149" width="700" height="205" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="1657" y="1184" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">未解决的问题</text><text x="1657" y="1217" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">仍没有 target token</text><text x="1657" y="1246" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">所以不能可靠形成新事实</text><rect x="40" y="1470" width="2320" height="90" rx="20" fill="#172235" stroke="#172235" stroke-width="0"/><text x="70" y="1513" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#8FD7D7" text-anchor="start">结论</text><text x="170" y="1513" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" fill="#FFFFFF" text-anchor="start">Oja 改变的是局部突触的稳定性，不改变监督信息量；公式更稳定，但仍没有答案 token 对齐。</text><text x="70" y="1544" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#F6C875" text-anchor="start">符号</text><text x="170" y="1544" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#D7DFEA" text-anchor="start">B=batch，T=sequence length，d=hidden size，r=fast rank，V=vocab size，M=memory slots，N=stored transitions。</text></svg>