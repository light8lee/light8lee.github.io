<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#9AA4B2"/></marker></defs><rect width="2400" height="1600" fill="#F7F9FC"/><rect x="0" y="0" width="2400" height="125" fill="#172235"/><rect x="38" y="25" width="72" height="72" rx="19" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="74" y="73" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="800" fill="#172235" text-anchor="middle">01</text><text x="138" y="58" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="750" fill="#FFFFFF" text-anchor="start">Residual Hebbian｜底层公式与状态</text><text x="138" y="92" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#C9D3E2" text-anchor="start">逐步读取公式、原位写入公式、张量形状及失败边界</text><rect x="40" y="165" width="750" height="1270" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="68" y="211" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">A｜推理读取（forward）</text><rect x="65" y="245" width="700" height="205" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="87" y="280" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">局部归一化</text><text x="87" y="313" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">N = H / √(mean(H²)+ε)</text><text x="87" y="342" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">shape: [B,T,d] → [B,T,d]</text><path d="M415,450 L415,465" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="471" width="700" height="205" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="87" y="506" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">低秩编码</text><text x="87" y="539" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Z = norm(tanh(NE), dim=−1)</text><text x="87" y="568" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">E:[d,r] 固定；Z:[B,T,r]</text><path d="M415,676 L415,691" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="697" width="700" height="205" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="87" y="732" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">快权重读取</text><text x="87" y="765" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">D = ZWfast</text><text x="87" y="794" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Wfast:[r,d]；D:[B,T,d]</text><path d="M415,902 L415,917" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="923" width="700" height="205" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="87" y="958" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">层输出</text><text x="87" y="991" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Hout = H + αD</text><text x="87" y="1020" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">α = adapter_strength</text><path d="M415,1128 L415,1143" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="1149" width="700" height="205" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="87" y="1184" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">进入下一层</text><text x="87" y="1217" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">不替换 Qwen block</text><text x="87" y="1246" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">只增加一个 residual side path</text><rect x="825" y="165" width="750" height="1270" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="853" y="211" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">B｜观察写入（no_grad）</text><rect x="850" y="245" width="700" height="205" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="872" y="280" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">局部前/后活动</text><text x="872" y="313" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">p = meanB,T(Z) ∈ ℝ[r]</text><text x="872" y="342" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">s = tanh(meanB,T(N)) ∈ ℝ[d]</text><path d="M1200,450 L1200,465" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="850" y="471" width="700" height="205" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="872" y="506" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">新奇度</text><text x="872" y="539" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">n=1（trace=0）</text><text x="872" y="568" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">否则 n=clip(1−cos(p,trace),0,2)</text><path d="M1200,676 L1200,691" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="850" y="697" width="700" height="205" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="872" y="732" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">三因子有效步长</text><text x="872" y="765" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">γ = η · reward · n</text><text x="872" y="794" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">reward ∈ [−1,1]</text><path d="M1200,902 L1200,917" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="850" y="923" width="700" height="205" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="872" y="958" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">Hebbian 更新</text><text x="872" y="991" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">W ← (1−λ)W + γ(p⊗s)</text><text x="872" y="1020" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">外积 shape: [r]⊗[d]=[r,d]</text><path d="M1200,1128 L1200,1143" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="850" y="1149" width="700" height="205" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="872" y="1184" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">稳态与 trace</text><text x="872" y="1217" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">每行 ‖Wj,:‖₂ ≤ c</text><text x="872" y="1246" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">trace←ρtrace+(1−ρ)p</text><rect x="1610" y="165" width="750" height="1270" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="1638" y="211" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">C｜状态、形状与边界</text><rect x="1635" y="245" width="700" height="205" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="1657" y="280" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">每层持久化状态</text><text x="1657" y="313" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Wℓfast:[r,d]</text><text x="1657" y="342" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">activity_traceℓ:[r]；update_count</text><path d="M1985,450 L1985,465" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1635" y="471" width="700" height="205" rx="18" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="1657" y="506" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">不会变化的部分</text><text x="1657" y="539" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Qwen 所有参数 requires_grad=False</text><text x="1657" y="568" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">随机投影 E 不持久化且固定</text><path d="M1985,676 L1985,691" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1635" y="697" width="700" height="205" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="1657" y="732" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">梯度边界</text><text x="1657" y="765" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">H、Z、N 在更新前 detach</text><text x="1657" y="794" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">不创建计算图，不调用 backward</text><path d="M1985,902 L1985,917" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1635" y="923" width="700" height="205" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="1657" y="958" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">作用范围</text><text x="1657" y="991" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">默认最后 m 个 decoder blocks</text><text x="1657" y="1020" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">每层拥有独立 Wℓfast</text><path d="M1985,1128 L1985,1143" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1635" y="1149" width="700" height="205" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="1657" y="1184" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">实验解释</text><text x="1657" y="1217" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">改变 logits ≠ 指向指定答案</text><text x="1657" y="1246" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">失败来自目标 token 缺失</text><rect x="40" y="1470" width="2320" height="90" rx="20" fill="#172235" stroke="#172235" stroke-width="0"/><text x="70" y="1513" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#8FD7D7" text-anchor="start">结论</text><text x="170" y="1513" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" fill="#FFFFFF" text-anchor="start">层内计算顺序完整，但局部相关性没有语言目标：它学到“活动一起发生”，不知道“答案应是哪一个 token”。</text><text x="70" y="1544" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#F6C875" text-anchor="start">符号</text><text x="170" y="1544" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#D7DFEA" text-anchor="start">B=batch，T=sequence length，d=hidden size，r=fast rank，V=vocab size，M=memory slots，N=stored transitions。</text></svg>