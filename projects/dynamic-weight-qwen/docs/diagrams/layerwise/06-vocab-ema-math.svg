<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#9AA4B2"/></marker></defs><rect width="2400" height="1600" fill="#F7F9FC"/><rect x="0" y="0" width="2400" height="125" fill="#172235"/><rect x="38" y="25" width="72" height="72" rx="19" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="74" y="73" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="800" fill="#172235" text-anchor="middle">06</text><text x="138" y="58" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="750" fill="#FFFFFF" text-anchor="start">Vocab EMA｜底层公式与状态</text><text x="138" y="92" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#C9D3E2" text-anchor="start">逐步读取公式、原位写入公式、张量形状及失败边界</text><rect x="40" y="165" width="750" height="1270" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="68" y="211" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">A｜推理读取（forward）</text><rect x="65" y="245" width="700" height="205" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="87" y="280" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">查询 key</text><text x="87" y="313" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">K=φ(H)∈ℝ[B,T,r]</text><path d="M415,450 L415,465" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="471" width="700" height="205" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="87" y="506" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">每 token 一列原型</text><text x="87" y="539" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">py=P[:,y]∈ℝ[r]</text><path d="M415,676 L415,691" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="697" width="700" height="205" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="87" y="732" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">相似度得分</text><text x="87" y="765" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">scorey = kᵀpy</text><text x="87" y="794" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">所有 V 个 token 同时比较</text><path d="M415,902 L415,917" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="923" width="700" height="205" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="87" y="958" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">logit 融合</text><text x="87" y="991" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">L&#x27;y=Lbase,y+αscorey</text><path d="M415,1128 L415,1143" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="65" y="1149" width="700" height="205" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="87" y="1184" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">自回归</text><text x="87" y="1217" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">新 token 继续形成下一位置的 k</text><rect x="825" y="165" width="750" height="1270" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="853" y="211" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">B｜观察写入（no_grad）</text><rect x="850" y="245" width="700" height="205" rx="18" fill="#E8F3FF" stroke="#2675D8" stroke-width="2"/><text x="872" y="280" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">按教师 token 分组</text><text x="872" y="313" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Sy={ki | yi=y}</text><path d="M1200,450 L1200,465" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="850" y="471" width="700" height="205" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="872" y="506" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">批内均值</text><text x="872" y="539" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">μy=mean(Sy)</text><path d="M1200,676 L1200,691" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="850" y="697" width="700" height="205" rx="18" fill="#F0ECFF" stroke="#7656C8" stroke-width="2"/><text x="872" y="732" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">目标原型</text><text x="872" y="765" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">p̂y=c·normalize(μy)</text><text x="872" y="794" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">c=max_row_norm</text><path d="M1200,902 L1200,917" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="850" y="923" width="700" height="205" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="872" y="958" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">EMA</text><text x="872" y="991" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">m=clip(1−η,0,0.99)</text><text x="872" y="1020" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">py←m·py+(1−m)·reward·p̂y</text><path d="M1200,1128 L1200,1143" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="850" y="1149" width="700" height="205" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="872" y="1184" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">计数与保存</text><text x="872" y="1217" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">counts[y]+=|Sy|</text><text x="872" y="1246" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">不保存事实/位置身份</text><rect x="1610" y="165" width="750" height="1270" rx="24" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="1638" y="211" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#24334A" text-anchor="start">C｜状态、形状与边界</text><rect x="1635" y="245" width="700" height="205" rx="18" fill="#FFF1DC" stroke="#D77A16" stroke-width="2"/><text x="1657" y="280" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">状态</text><text x="1657" y="313" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">P:[r,V]；counts:[V]</text><path d="M1985,450 L1985,465" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1635" y="471" width="700" height="205" rx="18" fill="#EEF1F5" stroke="#657184" stroke-width="2"/><text x="1657" y="506" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">hook</text><text x="1657" y="539" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">LM Head 输出 hook</text><text x="1657" y="568" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">Qwen 参数完全冻结</text><path d="M1985,676 L1985,691" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1635" y="697" width="700" height="205" rx="18" fill="#FFE7E5" stroke="#D14D41" stroke-width="2"/><text x="1657" y="732" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">压缩语义</text><text x="1657" y="765" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">同一 y 的全部上下文压成 py</text><text x="1657" y="794" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">旧上下文随 EMA 被淡化</text><path d="M1985,902 L1985,917" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1635" y="923" width="700" height="205" rx="18" fill="#E8F8F8" stroke="#16858B" stroke-width="2"/><text x="1657" y="958" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">缺失索引</text><text x="1657" y="991" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">无 question id / group / step</text><path d="M1985,1128 L1985,1143" fill="none" stroke="#9AA4B2" stroke-width="4" marker-end="url(#arr)"/><rect x="1635" y="1149" width="700" height="205" rx="18" fill="#E5F7EC" stroke="#278354" stroke-width="2"/><text x="1657" y="1184" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172235" text-anchor="start">实验现象</text><text x="1657" y="1217" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">MMLU 输出 100% 改变</text><text x="1657" y="1246" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" fill="#49566A" text-anchor="start">正确率 40%→0%</text><rect x="40" y="1470" width="2320" height="90" rx="20" fill="#172235" stroke="#172235" stroke-width="0"/><text x="70" y="1513" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#8FD7D7" text-anchor="start">结论</text><text x="170" y="1513" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="500" fill="#FFFFFF" text-anchor="start">EMA 的状态变量按 token 编号，而不是按事实编号；压缩后无法逆推出这个 token 属于哪段答案。</text><text x="70" y="1544" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#F6C875" text-anchor="start">符号</text><text x="170" y="1544" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#D7DFEA" text-anchor="start">B=batch，T=sequence length，d=hidden size，r=fast rank，V=vocab size，M=memory slots，N=stored transitions。</text></svg>