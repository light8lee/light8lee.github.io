<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">MASC vector dimension flow</title>
  <desc id="desc">Two-dimensional role and output embeddings concatenate into a four-dimensional history vector. Learnable projections map query and history into a unified four-dimensional hidden space, and the prediction head returns a four-dimensional expected vector for comparison with the four-dimensional realized history vector.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#20242a"/>
    </marker>
    <style>
      .label{font-family:"Segoe UI",Arial,sans-serif;fill:#20242a;font-size:30px;font-weight:650}
      .small{font-family:"Segoe UI",Arial,sans-serif;fill:#59636e;font-size:23px;font-weight:600}
      .math{font-family:"Cambria Math","Segoe UI",serif;fill:#20242a;font-size:30px;font-style:italic}
      .node{fill:#fff;stroke:#20242a;stroke-width:4;rx:18}
      .blue{stroke:#1c73c8}.green{stroke:#17823b}.orange{stroke:#e67916}.red{stroke:#dc2f2f}
      .line{fill:none;stroke:#20242a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .thin{fill:none;stroke:#20242a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .cell-b{fill:#edf6ff;stroke:#1c73c8;stroke-width:4}
      .cell-g1{fill:#eaf8ee;stroke:#17823b;stroke-width:4}
      .cell-g2{fill:#f0fbf6;stroke:#3aa56a;stroke-width:4}
      .cell-o{fill:#fff4e9;stroke:#e67916;stroke-width:4}
    </style>
  </defs>

  <rect width="1080" height="1920" fill="#ffffff"/>
  <text x="540" y="70" text-anchor="middle" class="label" font-size="38">MASC · DIMENSION FLOW</text>
  <rect x="390" y="92" width="300" height="52" rx="26" fill="#f2f5f7" stroke="#b9c2ca" stroke-width="2"/>
  <text x="540" y="127" text-anchor="middle" class="small">toy setting: dₑ = 2, D = 4</text>

  <!-- Raw text and encoder nodes -->
  <rect x="95" y="190" width="190" height="78" class="node blue"/>
  <rect x="445" y="190" width="190" height="78" class="node green"/>
  <rect x="795" y="190" width="190" height="78" class="node green"/>
  <text x="190" y="241" text-anchor="middle" class="math">Q</text>
  <text x="540" y="241" text-anchor="middle" class="math">Rₜ</text>
  <text x="890" y="241" text-anchor="middle" class="math">Oₜ</text>

  <path d="M190 268 V318" class="line"/>
  <path d="M540 268 V318" class="line"/>
  <path d="M890 268 V318" class="line"/>
  <rect x="105" y="322" width="170" height="70" class="node blue"/>
  <rect x="455" y="322" width="170" height="70" class="node green"/>
  <rect x="805" y="322" width="170" height="70" class="node green"/>
  <text x="190" y="367" text-anchor="middle" class="label">Embed</text>
  <text x="540" y="367" text-anchor="middle" class="label">Embed</text>
  <text x="890" y="367" text-anchor="middle" class="label">Embed</text>

  <!-- Three raw R2 vectors: exactly two cells each -->
  <path d="M190 392 V440" class="line"/>
  <path d="M540 392 V440" class="line"/>
  <path d="M890 392 V440" class="line"/>
  <g aria-label="q has two dimensions">
    <rect x="120" y="447" width="70" height="54" class="cell-b"/><rect x="190" y="447" width="70" height="54" class="cell-b"/>
    <text x="190" y="540" text-anchor="middle" class="math">q ∈ R²</text>
  </g>
  <g aria-label="role embedding has two dimensions">
    <rect x="470" y="447" width="70" height="54" class="cell-g1"/><rect x="540" y="447" width="70" height="54" class="cell-g1"/>
    <text x="540" y="540" text-anchor="middle" class="math">rₜ ∈ R²</text>
  </g>
  <g aria-label="output embedding has two dimensions">
    <rect x="820" y="447" width="70" height="54" class="cell-g2"/><rect x="890" y="447" width="70" height="54" class="cell-g2"/>
    <text x="890" y="540" text-anchor="middle" class="math">oₜ ∈ R²</text>
  </g>

  <!-- Concatenation: R2 plus R2 becomes R4 -->
  <path d="M540 550 V590 H690" class="thin"/>
  <path d="M890 550 V590 H690" class="thin"/>
  <path d="M690 590 V630" class="line"/>
  <rect x="600" y="620" width="180" height="64" class="node green"/>
  <text x="690" y="662" text-anchor="middle" class="label">CONCAT</text>
  <path d="M690 684 V725" class="line"/>
  <g aria-label="concatenated history vector has four dimensions">
    <rect x="550" y="735" width="70" height="54" class="cell-g1"/><rect x="620" y="735" width="70" height="54" class="cell-g1"/>
    <rect x="690" y="735" width="70" height="54" class="cell-g2"/><rect x="760" y="735" width="70" height="54" class="cell-g2"/>
    <text x="690" y="828" text-anchor="middle" class="math">hₜ = rₜ ∥ oₜ ∈ R⁴</text>
    <text x="690" y="860" text-anchor="middle" class="small">2 + 2 = 4 dimensions</text>
  </g>

  <!-- Projection paths -->
  <path d="M190 550 V760 H280 V825" class="line"/>
  <rect x="145" y="830" width="270" height="76" class="node orange"/>
  <text x="280" y="878" text-anchor="middle" class="math">f_q : R² → R⁴</text>
  <path d="M280 906 V958" class="line"/>
  <g aria-label="projected query has four dimensions">
    <rect x="140" y="968" width="70" height="54" class="cell-o"/><rect x="210" y="968" width="70" height="54" class="cell-o"/>
    <rect x="280" y="968" width="70" height="54" class="cell-o"/><rect x="350" y="968" width="70" height="54" class="cell-o"/>
    <text x="280" y="1060" text-anchor="middle" class="math">q̃ ∈ R⁴</text>
  </g>

  <path d="M690 870 V900" class="line"/>
  <rect x="555" y="905" width="270" height="76" class="node orange"/>
  <text x="690" y="953" text-anchor="middle" class="math">f_h : R⁴ → R⁴</text>
  <path d="M690 981 V1030" class="line"/>
  <g aria-label="projected history has four dimensions">
    <rect x="550" y="1040" width="70" height="54" class="cell-o"/><rect x="620" y="1040" width="70" height="54" class="cell-o"/>
    <rect x="690" y="1040" width="70" height="54" class="cell-o"/><rect x="760" y="1040" width="70" height="54" class="cell-o"/>
    <text x="690" y="1132" text-anchor="middle" class="math">h̃ₜ ∈ R⁴</text>
  </g>

  <!-- Frozen LLM and output projection -->
  <path d="M280 1070 V1180 H485" class="thin"/>
  <path d="M690 1142 V1180 H595" class="thin"/>
  <path d="M540 1180 V1215" class="line"/>
  <rect x="325" y="1220" width="430" height="116" class="node orange"/>
  <text x="540" y="1270" text-anchor="middle" class="label" font-size="36">FROZEN LLM ❄</text>
  <text x="540" y="1307" text-anchor="middle" class="small">unified input hidden size D = 4</text>
  <path d="M540 1336 V1380" class="line"/>
  <rect x="370" y="1385" width="340" height="76" class="node orange"/>
  <text x="540" y="1434" text-anchor="middle" class="math">f_θ : R⁴ → R⁴</text>
  <path d="M540 1461 V1512" class="line"/>

  <!-- Expected and observed comparison vectors: both R4 -->
  <g aria-label="expected next-step vector has four dimensions">
    <rect x="220" y="1522" width="70" height="54" class="cell-o"/><rect x="290" y="1522" width="70" height="54" class="cell-o"/>
    <rect x="360" y="1522" width="70" height="54" class="cell-o"/><rect x="430" y="1522" width="70" height="54" class="cell-o"/>
    <text x="360" y="1615" text-anchor="middle" class="math">x̂ₜ ∈ R⁴</text>
  </g>
  <path d="M830 762 H930 V1490 H790 V1512" class="line"/>
  <g aria-label="realized current-step vector has four dimensions">
    <rect x="650" y="1522" width="70" height="54" class="cell-g1"/><rect x="720" y="1522" width="70" height="54" class="cell-g1"/>
    <rect x="790" y="1522" width="70" height="54" class="cell-g2"/><rect x="860" y="1522" width="70" height="54" class="cell-g2"/>
    <text x="790" y="1615" text-anchor="middle" class="math">xₜ := hₜ ∈ R⁴</text>
  </g>

  <path d="M360 1625 V1695 H500" class="line"/>
  <path d="M790 1625 V1695 H580" class="line"/>
  <circle cx="540" cy="1695" r="58" fill="#fff5f5" stroke="#dc2f2f" stroke-width="5"/>
  <text x="540" y="1708" text-anchor="middle" class="label" fill="#dc2f2f">−</text>
  <text x="540" y="1800" text-anchor="middle" class="label">same R⁴ comparison space</text>
  <text x="540" y="1842" text-anchor="middle" class="small">Only equal-dimensional vectors enter residual and cosine scoring.</text>
</svg>
